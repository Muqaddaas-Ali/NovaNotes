<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaNotes - Elegant Note Taking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar or Header section -->
        <header class="app-header">
            <div class="logo-area">
                <div class="logo-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 3H5a2 2 0 0 0-2 2v14c0 1.1.9 2 2 2h14a2 2 0 0 0 2-2V8.5L15.5 3Z"/><path d="M15 3v6h6"/><path d="M10 18h4"/><path d="M8 14h8"/><path d="M8 10h3"/></svg>
                </div>
                <h1>NovaNotes</h1>
            </div>
            <p class="subtitle">Capture your thoughts beautifully</p>
            <div class="stats-card">
                <span id="notes-count">0</span> notes saved
            </div>
        </header>

        <main class="app-main">
            <!-- Note creation form section -->
            <section class="creation-section">
                <div class="form-card">
                    <h2 class="section-title">Create a Note</h2>
                    <form id="note-form">
                        <div class="input-group">
                            <input type="text" id="note-title" placeholder="Title" autocomplete="off" required>
                        </div>
                        <div class="input-group">
                            <textarea id="note-body" placeholder="Take a note..." rows="4" required></textarea>
                        </div>
                        
                        <!-- Premium detail: Color palette options for custom note background -->
                        <div class="color-picker-wrapper">
                            <label>Choose Color:</label>
                            <div class="color-options">
                                <label class="color-radio" style="--color-theme: #fdf6e2;">
                                    <input type="radio" name="note-color" value="#fdf6e2" checked>
                                    <span class="color-dot"></span>
                                </label>
                                <label class="color-radio" style="--color-theme: #e2f4fd;">
                                    <input type="radio" name="note-color" value="#e2f4fd">
                                    <span class="color-dot"></span>
                                </label>
                                <label class="color-radio" style="--color-theme: #e2fdf2;">
                                    <input type="radio" name="note-color" value="#e2fdf2">
                                    <span class="color-dot"></span>
                                </label>
                                <label class="color-radio" style="--color-theme: #fde2f3;">
                                    <input type="radio" name="note-color" value="#fde2f3">
                                    <span class="color-dot"></span>
                                </label>
                                <label class="color-radio" style="--color-theme: #eee2fd;">
                                    <input type="radio" name="note-color" value="#eee2fd">
                                    <span class="color-dot"></span>
                                </label>
                            </div>
                        </div>

                        <button type="submit" class="submit-btn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                            Add Note
                        </button>
                    </form>
                </div>
            </section>

            <!-- Search and Filter (Bonus Premium Detail for Internship Success) -->
            <section class="controls-section">
                <div class="search-bar">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="search-icon"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="search-input" placeholder="Search notes...">
                </div>
            </section>

            <!-- Saved Notes display section -->
            <section class="notes-section">
                <div id="notes-grid" class="notes-grid">
                    <!-- Note items will be dynamically rendered here by JavaScript -->
                    <!-- Fallback UI when there are no notes -->
                    <div id="empty-state" class="empty-state">
                        <!-- <div class="empty-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>
                        </div> -->
                        <p>No notes yet. Write your first note above!</p>
                    </div>
                </div>
            </section>
        </main>

        <footer class="app-footer">
            <p>NovaNotes &copy; 2026 • Elegant Note Taking Application</p>
        </footer>
    </div>

    <!-- Main JavaScript Logic -->
    <script src="script.js"></script>
</body>
</html>
